name: experience checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      - run: npm install -g bun@1.3.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:ui
        env:
          CI_CHECK_KIND: visual
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: visual-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  jev:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      - run: npm install -g bun@1.3.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:jev
        env:
          CI_CHECK_KIND: jev
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: jev-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  journey:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
      - run: npm install -g bun@1.3.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:journey
        env:
          CI_CHECK_KIND: journey
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: journey-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
